# Default configuration. Override any key with: java -jar link-shortener.jar --config my.properties
# Durations use ISO-8601: PT1H is one hour, PT24H is a day, P7D is a week.

# Domain shown in short links, for example lnk.local/aB3dE9x
short.domain=lnk.local
# Number of base62 characters in a short code (4-32)
short.code-length=7

# Lifetime of a link. No command changes it.
link.ttl=PT24H
# Clicks allowed when the user gives no limit
link.click-limit.default=10
# Largest click limit a user may set
link.click-limit.max=1000
# How long the service keeps the codes of expired links
link.tombstone-retention=P7D

# Longest URL accepted
url.max-length=2048

# How often the background job deletes expired links
cleanup.interval=PT30S

# Directory for links, notifications and the current user
storage.dir=data
